name: Release

# Só por tag manual (v*): a tag sai com o OK de quem responde pelo método, citando o SHA.
# Sem auto-release de propósito.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Content safety gate
        run: bash scripts/publish-check.sh

      - name: Version gate
        run: python3 scripts/check-versions.py

      - name: Unit tests
        run: python3 -m unittest discover -s tests -t tests -v

      - name: Build skill zips (+ SHA256SUMS.txt)
        run: bash scripts/package.sh && cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release with zips
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
