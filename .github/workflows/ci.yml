name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # o version gate compara com o commit anterior

      - name: Content safety gate
        run: bash scripts/publish-check.sh

      # Skill alterada sem subir metadata.version reprova: o zip diria uma versão que não muda quando o conteúdo muda.
      - name: Version gate
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check-versions.py --base "$BASE"

      - name: Copias de compartilhado/ em dia
        run: python3 scripts/sync-compartilhados.py --check

      - name: Scripts compile
        run: python3 -m py_compile compartilhado/*.py skills/*/scripts/*.py scripts/*.py

      - name: Unit tests
        run: python3 -m unittest discover -s tests -t tests -v

      - name: Shell scripts parse
        run: for f in scripts/package.sh scripts/publish-check.sh; do bash -n "$f" || exit 1; done
